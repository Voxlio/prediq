name: predictions

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would happen, write nothing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prediq-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record predictions for matches starting soon
        id: freeze
        run: node tools/freeze.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Attach results to matches that have finished
        id: settle
        if: always()
        run: node tools/settle.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit whatever changed
        id: commit
        if: ${{ always() && !inputs.dry_run }}
        env:
          RECORDED: ${{ steps.freeze.outputs.recorded || 0 }}
          SETTLED: ${{ steps.settle.outputs.settled || 0 }}
          STALE: ${{ steps.settle.outputs.stale || 0 }}
        run: |
          set -euo pipefail
          git config user.name 'prediq-archive'
          git config user.email 'prediq-archive@users.noreply.github.com'

          mkdir -p data
          git add data

          if git diff --cached --quiet; then
            echo "archive unchanged (${STALE} predictions still unresolved)"
            exit 0
          fi

          git commit -m "archive: ${RECORDED} recorded, ${SETTLED} settled"

          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt ${attempt})"

            if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              echo ''
              echo '=== REBASE CONFLICT — nothing pushed ==='
              git diff --name-only --diff-filter=U | sed 's/^/  conflicted: /'
              echo ''
              echo 'A conflict under data/ means the same record was written'
              echo 'twice with different contents. Records are supposed to be'
              echo 'written once, so this is worth reading rather than retrying:'
              echo '  git log -p data/'
              echo 'Resolving it automatically would mean this job choosing which'
              echo 'of two predictions we really made, which is the one thing it'
              echo 'must never do.'
              git rebase --abort || true
              exit 1
            fi
          done
          echo 'could not push after three attempts'
          exit 1

      - name: Mirror the archive into Firestore
        id: mirror
        if: ${{ !inputs.dry_run && steps.commit.outcome == 'success' }}
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/mirror.mjs
